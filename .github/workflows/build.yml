name: Build Android APK (LYX)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22 LTS)
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Setup Java (Zulu 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Install Capacitor CLI & Android Engine
        run: |
          npm install -D @capacitor/cli
          npm install @capacitor/android

      - name: Add Android Platform
        run: |
          rm -rf android
          npx cap add android

      - name: Sync Capacitor Plugins
        run: npx cap sync android

      - name: Compile Android APK (Debug)
        working-directory: ./android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: lyx-app-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
